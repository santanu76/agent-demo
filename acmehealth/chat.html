<!-- CHAT CLIENT (reference) — generated by AiGenie Hub for tenant `acmehealth`.
     YOURS TO EDIT: branding, styles, and API_URL. Point API_URL at your own
     backend (e.g. a route wrapping master_agent.handle) in production. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>acmehealth — assistant</title>
<style>
:root{--bg:#0e1726;--panel:#16233a;--me:#12a5a0;--bot:#1d2d49;--text:#e8eef7;--dim:#8fa3bf}
*{box-sizing:border-box;margin:0}body{font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
header{padding:12px 18px;background:var(--panel);display:flex;gap:10px;align-items:center}
header b{font-size:17px}header small{color:var(--dim)}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:9px 13px;border-radius:12px;white-space:pre-wrap}
.me{background:var(--me);align-self:flex-end}.bot{background:var(--bot);align-self:flex-start}
.meta{font-size:12px;color:var(--dim);align-self:flex-start}
.card{background:var(--panel);border-radius:10px;padding:8px 12px;align-self:flex-start;font-size:13px}
.card td{padding:2px 8px 2px 0;color:var(--dim)}.card td+td{color:var(--text)}
form{display:flex;gap:8px;padding:12px}input,button{font:inherit;border:0;border-radius:9px;padding:10px 13px}
input{flex:1;background:var(--panel);color:var(--text)}button{background:var(--me);color:#fff;cursor:pointer}
.fb a{cursor:pointer;margin-right:6px;text-decoration:none}
.progress{height:4px;background:#243755;border-radius:2px;width:180px}.progress i{display:block;height:4px;background:var(--me);border-radius:2px}
</style></head><body>
<header><b>acmehealth</b><small>powered assistant</small>
<span style="flex:1"></span><small id="who"></small></header>
<div id="log"></div>
<form onsubmit="send(event)"><input id="box" placeholder="Type a message..." autocomplete="off"><button>Send</button></form>
<script>
"use strict";
/* ── EDIT THESE for your deployment ─────────────────────────────────── */
const API_URL="http://127.0.0.1:9000/gateway/acmehealth/invoke"; // your backend in prod
const FEEDBACK_URL="http://127.0.0.1:9000/ops/api";   // "" to disable thumbs
const ENTITY_REF="";                                   // known-customer id, if any
/* ───────────────────────────────────────────────────────────────────── */
const log=document.getElementById("log"),box=document.getElementById("box");
let userId=localStorage.getItem("chat_uid_acmehealth")||"";
let session="s"+Date.now(),lastPct=null,lastQuery="";
document.getElementById("who").textContent=userId?("you: "+userId):"new user";
function add(cls,text){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;log.appendChild(d);log.scrollTop=1e9;return d}
function addHTML(cls,html){const d=document.createElement("div");d.className=cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=1e9;return d}
async function call(payload){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({payload})});
  return r.json();}
async function send(e,answers){
  if(e)e.preventDefault();
  const text=answers?"":box.value.trim();
  if(!answers&&!text)return;
  if(!answers){add("me",text);box.value="";lastQuery=text;}
  const payload={query:text,user_id:userId,session_id:session,
    source:"acmehealth",onboarding_answers:answers||[]};
  if(ENTITY_REF)payload.entity_link={entity_ref:ENTITY_REF,entity_scope:"acmehealth"};
  let d;try{d=await call(payload);}catch(err){return add("bot","(connection problem - try again)")}
  if(d.user_id&&d.user_id!==userId){userId=d.user_id;
    localStorage.setItem("chat_uid_acmehealth",userId);
    document.getElementById("who").textContent="you: "+userId;}
  if(d.response_text){add("bot",d.response_text);feedback();}
  (d.cards||[]).forEach(c=>{const data=c.data||c.payload||{};
    addHTML("card","<table>"+Object.entries(data).filter(([,v])=>typeof v!=="object")
      .map(([k,v])=>`<tr><td>${k}</td><td>${String(v)}</td></tr>`).join("")+"</table>");});
  (d.onboarding_questions||[]).forEach(q=>ask(q));
  if(d.profile_question)ask(d.profile_question);
  if(d.profile_completeness!=null&&d.profile_completeness!==lastPct){
    addHTML("meta",`profile ${d.profile_completeness}% complete <div class="progress"><i style="width:${d.profile_completeness}%"></i></div>`);
    lastPct=d.profile_completeness;}
}
function ask(q){
  const wrap=addHTML("card",`<div>${q.question||q.text||""}</div>`);
  const inp=document.createElement("input");inp.placeholder="answer...";inp.style.marginTop="6px";
  inp.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();
    wrap.replaceChildren(document.createTextNode((q.question||"")+" -> "+inp.value));
    send(null,[{question_id:q.question_id||q.id,answer:inp.value}]);}};
  wrap.appendChild(inp);inp.focus();}
function feedback(){
  if(!FEEDBACK_URL)return;
  const bot=log.lastChild,f=document.createElement("div");f.className="meta fb";
  f.innerHTML='<a>&#128077;</a><a>&#128078;</a>';
  const[up,down]=f.querySelectorAll("a");
  const sendFb=v=>fetch(FEEDBACK_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"feedback.put",payload:{tenant_id:"acmehealth",
      verdict:v,session_id:session,query:lastQuery,response:bot.textContent}})})
    .then(()=>f.textContent=v==="up"?"thanks!":"thanks - we will improve");
  up.onclick=()=>sendFb("up");down.onclick=()=>sendFb("down");
  log.appendChild(f);}
add("bot","Hi! How can I help you today?");
</script></body></html>
