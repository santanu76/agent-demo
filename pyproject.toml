[project]
name = "acmehealth-agents"
version = "0.1.0"
description = "AiGenie-generated agent workspace for acmehealth — your code, your repo."
requires-python = ">=3.11"
dependencies = [
    "aigenie-sdk>=0.1.0,<0.2",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acmehealth"]

[tool.pytest.ini_options]
testpaths = ["acmehealth"]
